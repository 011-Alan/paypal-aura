# ============================================================================
# AURA — 6 Independent Astropods Agent Pods (Local Multi-Pod Compose)
# Runs all 6 official Astropods agent containers paired with their official
# `astropods/messaging:latest` gRPC + Web Adapter sidecars on ports 3110..3115.
# ============================================================================

services:
  # --- Pod 1: Financial Planner (Port 3110) ---
  planner-messaging:
    image: astropods/messaging:latest
    environment:
      - WEB_LISTEN_ADDR=:8080
      - WEB_ENABLED=true
      - GRPC_ENABLED=true
      - GRPC_LISTEN_ADDR=:9090
      - STORAGE_TYPE=memory
      - DEV=true
    ports:
      - "3110:8080"
    networks:
      - pod-planner

  planner-agent:
    image: aura-financial-planner-linux-amd64:c800fdc6
    depends_on:
      - planner-messaging
    environment:
      - GRPC_SERVER_ADDR=planner-messaging:9090
      - ASTRO_AGENT_NAME=aura-financial-planner
    volumes:
      - ./aura-financial-planner/agent:/app/agent:ro
    networks:
      - pod-planner

  # --- Pod 2: Transaction Intelligence (Port 3111) ---
  tx-messaging:
    image: astropods/messaging:latest
    environment:
      - WEB_LISTEN_ADDR=:8080
      - WEB_ENABLED=true
      - GRPC_ENABLED=true
      - GRPC_LISTEN_ADDR=:9090
      - STORAGE_TYPE=memory
      - DEV=true
    ports:
      - "3111:8080"
    networks:
      - pod-tx

  tx-agent:
    image: aura-transaction-intelligence-linux-amd64:47ae4937
    depends_on:
      - tx-messaging
    environment:
      - GRPC_SERVER_ADDR=tx-messaging:9090
      - ASTRO_AGENT_NAME=aura-transaction-intelligence
    volumes:
      - ./aura-transaction-intelligence/agent:/app/agent:ro
    networks:
      - pod-tx

  # --- Pod 3: Mandate Intelligence (Port 3112) ---
