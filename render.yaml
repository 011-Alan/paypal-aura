# ============================================================================
# PROJECT AURA — Render 100% Free-Tier Blueprint Specification (render.yaml)
# Requires NO credit card:
# 1. aura-backend-api (Free Node.js Web Service + Internal Worker)
# 2. aura-frontend (Free Static Site)
# ============================================================================

services:
  # 1. Backend Web Service (Free tier - Node.js + Express + Built-in Background Worker)
  - type: web
    name: aura-backend-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ENABLE_BACKGROUND_WORKERS
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APPROVAL_TOKEN_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_IDENTITY_REDIRECT_URI
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ASTROPODS_API_URL
        value: https://astropods.com/api/v1
      - key: ASTROPODS_ACCOUNT
        value: alan-011
      - key: ASTROPODS_ACCESS_TOKEN
        sync: false
      - key: ASTROPODS_API_KEY
        sync: false
      - key: ASTROPODS_DEPLOYMENT_FINANCIAL_PLANNER
        value: tg9-jnv-jnj
      - key: ASTROPODS_DEPLOYMENT_TRANSACTION_INTELLIGENCE
        value: 29a-xyw-ocj
      - key: ASTROPODS_DEPLOYMENT_MANDATE_INTELLIGENCE
        value: zw0-0sb-4hb
      - key: ASTROPODS_DEPLOYMENT_FINANCIAL_RECOVERY
        value: 50r-wkz-95o
      - key: ASTROPODS_DEPLOYMENT_PURCHASE_INTELLIGENCE
        value: zil-ovw-1pe
      - key: ASTROPODS_DEPLOYMENT_FINANCIAL_GUARDIAN
        value: zau-aeq-l17
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false

  # 2. Frontend Static Site (Free tier - React + TypeScript + Vite)
  - type: web
    name: aura-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aura-backend-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
