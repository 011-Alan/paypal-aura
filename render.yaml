# ============================================================================
# PROJECT AURA — Render 100% Free-Tier Blueprint Specification (render.yaml)
# Requires NO credit card:
# 1. aura-backend-api (Free Node.js Web Service + Internal Worker)
# 2. aura-frontend (Free Static Site)
# ============================================================================

services:
  # 1. Backend Web Service (Free tier - Node.js + Express + Built-in Background Worker)
  - type: web
    name: aura-backend-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ENABLE_BACKGROUND_WORKERS
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APPROVAL_TOKEN_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ASTROPODS_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false

  # 2. Frontend Static Site (Free tier - React + TypeScript + Vite)
  - type: web
    name: aura-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aura-backend-api
          property: host
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aura-backend-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
